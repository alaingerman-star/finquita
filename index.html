<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finquita Gloria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f7e6cc;
      font-family: system-ui, sans-serif;
    }

    .welcome {
      position: relative;
      width: min(100vw, 70.37vh);
      width: min(100vw, 70.37dvh);
      aspect-ratio: 1052 / 1495;
    }

    .welcome img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .welcome button {
      position: absolute;
      left: 6.84%;
      width: 86.31%;
      padding: 0;
      border: 0;
      border-radius: 4rem;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .welcome button:active {
      background: rgb(0 0 0 / 12%);
    }

    .welcome button:focus-visible {
      outline: 4px solid white;
      outline-offset: -8px;
    }

    #actionBtn {
      top: 44.88%;
      height: 12.84%;
    }

    #confirmBtn {
      top: 60.87%;
      height: 12.31%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }

    #cameraContainer {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      overflow-y: auto;
      background: #171717;
      color: white;
    }

    .camera-preview {
      position: relative;
      flex-shrink: 0;
      width: min(100%, 42rem);
      height: min(58vh, 25rem);
      height: min(58dvh, 25rem);
      margin-top: auto;
      overflow: hidden;
      border-radius: 1rem;
      background: black;
    }

    #webcam {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(78%, 62vh);
      aspect-ratio: 1.59;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: end center;
      padding: 0.5rem;
      border: 3px dashed #ffc247;
      border-radius: 0.75rem;
      pointer-events: none;
    }

    #overlay span,
    #statusBanner {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      background: #005a5b;
      text-align: center;
    }

    #statusText {
      margin: 0;
    }

    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: auto;
    }

    .camera-controls button {
      min-height: 48px;
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 0.65rem;
      font: inherit;
      cursor: pointer;
    }

    #captureBtn {
      background: #ffc247;
      color: #171717;
      font-weight: 700;
    }
  </style>

  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="./app.js"></script>
</head>

<body>
  <main class="welcome" aria-label="Finquita Gloria">
    <img src="./finquita-gloria.png" alt="" width="1052" height="1495">

    <button id="actionBtn" type="button">
      <span id="btnText" class="sr-only">Foto de cédula</span>
    </button>

    <button id="confirmBtn" type="button">
      <span class="sr-only">Entrar</span>
    </button>
  </main>

  <section id="cameraContainer" class="hidden" aria-label="Cámara para la cédula">
    <div class="camera-preview">
      <video id="webcam" autoplay playsinline muted></video>

      <div id="overlay">
        <span>Alinee la cédula dentro del marco</span>
      </div>
    </div>

    <div id="statusBanner" class="hidden" role="status">
      <p id="statusText"></p>
    </div>

    <div class="camera-controls">
      <button id="captureBtn" type="button">Tomar foto</button>
      <button id="cancelCameraBtn" type="button">Cancelar</button>
    </div>
  </section>
</body>
</html>

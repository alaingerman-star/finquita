<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrada Finquita Gloria</title>
    <!-- Tailwind CSS Platform -->
    <script src="https://tailwindcss.com"></script>
    <!-- Visual Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: sans-serif; touch-action: manipulation; }
        /* Add pop shadow and clear tap feedback for child operators */
        .child-btn { 
            transition: all 0.1s ease-in-out;
            box-shadow: 0 12px 0px #065f46;
        }
        .child-btn:active { 
            transform: translateY(8px);
            box-shadow: 0 4px 0px #065f46;
        }
        .confirm-btn-style {
            box-shadow: 0 12px 0px #1e40af;
        }
        .confirm-btn-style:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0px #1e40af;
        }
    </style>
</head>
<body class="bg-slate-950 text-white flex flex-col justify-between items-center min-h-screen w-full p-8 md:p-12 select-none overflow-hidden">

    <!-- HEADER: Always perfectly centered and scaled up for visibility -->
    <header class="w-full text-center my-2">
        <h1 class="text-5xl md:text-7xl font-extrabold text-yellow-400 tracking-wider drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
            🏡 FINQUITA GLORIA
        </h1>
        <p class="text-2xl md:text-3xl mt-4 text-slate-200 font-black bg-slate-900/60 inline-block px-6 py-2 rounded-full border border-slate-800">
            ¡BIENVENIDO! Pon tu cédula frente al lente
        </p>
    </header>

    <!-- MAIN VIEWER: Force center alignments and explicit bounds for tablets -->
    <main class="w-full max-w-2xl flex flex-col items-center justify-center my-auto px-4">
        <!-- Live Video Containment Bracket -->
        <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-[2.5rem] border-8 border-slate-800 overflow-hidden shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)] flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            
            <!-- Default Placeholder Icon when camera is offline -->
            <div id="placeholder" class="text-center p-6 flex flex-col items-center justify-center">
                <i class="fa-solid fa-id-card text-9xl text-slate-700 animate-pulse"></i>
                <p class="text-slate-500 font-extrabold mt-6 text-xl tracking-wide uppercase">Cámara Esperando Acción</p>
            </div>
            
            <!-- Giant Target Guide Overlay Border -->
            <div id="overlay" class="absolute inset-0 border-[8px] border-dashed border-yellow-400 m-10 rounded-[1.5rem] hidden pointer-events-none z-10 animate-pulse"></div>
        </div>

        <!-- Banner Updates Box -->
        <div id="statusBanner" class="mt-6 text-center w-full min-h-[60px] flex items-center justify-center hidden">
            <p id="statusText" class="text-3xl md:text-4xl font-black text-green-400 tracking-wide drop-shadow"></p>
        </div>
    </main>

    <!-- FOOTER ACTIONS: Centered block layout with massive physical action boundaries -->
    <footer class="w-full max-w-2xl mt-auto mb-4 px-4 flex flex-col items-center justify-center">
        
        <!-- GIANT ACTION BUTTON: Easy target for a 6-year-old child -->
        <button id="actionBtn" class="child-btn w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-4xl md:text-5xl py-10 rounded-[2.5rem] flex items-center justify-center gap-6 border-2 border-emerald-400">
            <i class="fa-solid fa-camera text-5xl md:text-6xl"></i>
            <span id="btnText" class="tracking-wider uppercase">¡FOTO AQUÍ!</span>
        </button>

        <!-- GIANT CONFIRMATION BUTTON -->
        <button id="confirmBtn" class="confirm-btn-style child-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-4xl md:text-5xl py-10 rounded-[2.5rem] flex items-center justify-center gap-6 border-2 border-blue-400 hidden">
            <i class="fa-solid fa-cloud-arrow-up text-5xl md:text-6xl"></i>
            <span class="tracking-wider uppercase">ENTRAR ✅</span>
        </button>
        
    </footer>

    <!-- Client Platform Libraries Dependencies Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="app.js"></script>
</body>
</html>

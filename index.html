<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finquita Gloria</title>
    <!-- Tailwind CSS for precise structural positioning -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for the precise camera icon asset -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts: Inter for crisp system UI text and Playfair for the brand font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <!-- Tesseract.js (OCR Engine) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Firebase SDK Compat Core -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7e6cc; /* Sandy background fallback */
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #034b4b;
        }
        /* Custom colors pulled directly from your image asset */
        .btn-teal {
            background-color: #005a5b;
        }
        .btn-teal:hover {
            background-color: #004647;
        }
        .btn-orange {
            background-color: #d67b00;
        }
        .btn-orange:hover {
            background-color: #b86a00;
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between items-center relative overflow-hidden bg-cover bg-center select-none" style="background-image: url('https://unsplash.com');">

    <!-- TOP BRAND SECTION -->
    <div class="w-full flex flex-col items-center pt-16 text-center z-10 px-4">
        <!-- Interactive Brand Illustration Elements -->
        <div class="relative w-44 h-32 flex items-center justify-center mb-2">
            <!-- Palm Tree Icon Wrapper -->
            <span class="text-7xl absolute bottom-2 left-6 z-20 drop-shadow-sm transform -rotate-6">🌴</span>
            <!-- Sun Graphic Backdrop -->
            <div class="w-16 h-16 bg-amber-400 rounded-full absolute bottom-4 right-10 shadow-[0_0_20px_rgba(251,191,36,0.4)]"></div>
            <!-- Abstract Graphic Waves under the sun -->
            <div class="absolute bottom-1 w-24 h-4 overflow-hidden flex flex-col gap-0.5 opacity-80">
                <div class="w-full h-1 bg-cyan-500 rounded-full transform translate-x-2"></div>
                <div class="w-full h-1.5 bg-teal-600 rounded-full"></div>
            </div>
        </div>
        
        <!-- Typography identical to graphic layout -->
        <h1 class="text-5xl font-bold brand-title tracking-tight drop-shadow-sm">
            Finquita Gloria
        </h1>
        <!-- Elegant golden base swash line -->
        <div class="w-40 h-1 bg-amber-500 rounded-full mt-3 opacity-90 shadow-sm"></div>
    </div>

    
    <div id="cameraContainer" class="absolute inset-0 bg-neutral-900/80 z-20 flex flex-col items-center justify-center p-6 hidden">
        <div class="relative w-full max-w-sm aspect-[3/4] bg-black rounded-3xl overflow-hidden border-4 border-white/20 shadow-2xl">
            <video id="webcam" class="w-full h-full object-cover transform -scale-x-100" autoplay playsinline></video>
            <div id="overlay" class="absolute inset-0 border-4 border-dashed border-amber-400 m-8 rounded-xl pointer-events-none flex items-center justify-center">
                <span class="text-xs bg-amber-400 text-neutral-900 px-3 py-1 font-bold rounded-md uppercase tracking-wider">Alinee la cédula</span>
            </div>
        </div>
        <!-- Status Banner Popup inside the overlay frame -->
        <div id="statusBanner" class="w-full max-w-sm bg-[#005a5b] border border-teal-700 py-3 px-4 rounded-xl text-center shadow-lg mt-4 hidden">
            <p id="statusText" class="text-sm font-medium tracking-wide text-white flex items-center justify-center gap-2"></p>
        </div>
    </div>

    <!-- MAIN CONTROL BUTTON BLOCK -->
    <div class="w-full max-w-md flex flex-col gap-5 px-8 pb-32 z-10">
        
        <!-- BUTTON 1: FOTO DE CÉDULA -->
        <button id="actionBtn" class="w-full btn-teal text-white font-bold text-2xl py-5 px-6 rounded-[24px] shadow-[0_6px_16px_rgba(0,90,91,0.3)] flex items-center justify-center gap-4 transition-all duration-150 transform active:scale-[0.99]">
            <i class="fa-solid fa-camera text-3xl"></i>
            <span id="btnText">Foto de cédula</span>
        </button>

        <!-- BUTTON 2: ENTRAR -->
        <button id="confirmBtn" class="w-full btn-orange text-white font-bold text-3xl py-5 px-6 rounded-[24px] shadow-[0_6px_16px_rgba(214,123,0,0.3)] text-center transition-all duration-150 transform active:scale-[0.99]">
            Entrar
        </button>
        
    </div>

    <!-- INJECTED APP SCRIPT LINK -->
    <script src="app.js"></script>
</body>
</html>

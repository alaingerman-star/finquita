<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finquita Gloria - Acceso</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Tesseract.js (OCR Engine) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Firebase SDK (Compat Version to match existing script style) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        .beach-bg {
            background: url('https://unsplash.com') no-repeat center bottom;
            background-size: cover;
        }
    </style>
</head>
<body class="beach-bg min-h-screen flex flex-col justify-between items-center p-6 text-white relative">
    <!-- Subtle overlay to make UI elements pop over dynamic backgrounds -->
    <div class="absolute inset-0 bg-amber-50/10 pointer-events-none"></div>

    <!-- MAIN BRAND HEADER -->
    <div class="z-10 w-full max-w-md flex flex-col items-center pt-8 text-center">
        <!-- Logo Area Placeholder: Replace with actual graphic if available -->
        <div class="relative w-40 h-40 flex items-center justify-center mb-2">
            <span class="text-6xl">🌴</span>
            <span class="text-3xl absolute bottom-6 right-4">☀️</span>
        </div>
        <h1 class="text-4xl font-extrabold tracking-wide drop-shadow-md text-[#085454]" style="font-family: serif;">
            Finquita Gloria
        </h1>
        <div class="w-32 h-1 bg-amber-500 rounded-full mt-2 shadow-sm"></div>
    </div>

    <!-- INTERACTIVE SCREEN / WEBCAM ZONE -->
    <div class="z-10 w-full max-w-sm my-auto flex flex-col items-center gap-4">
        <!-- Camera Viewer Interface Box -->
        <div class="relative w-full aspect-[4/3] bg-neutral-900/40 backdrop-blur-sm rounded-2xl overflow-hidden border-2 border-dashed border-emerald-600/40 flex items-center justify-center shadow-inner">
            <video id="webcam" class="w-full h-full object-cover hidden transform -scale-x-100" autoplay playsinline></video>
            <div id="placeholder" class="text-center p-4">
                <i class="fa-solid fa-id-card text-5xl text-emerald-800/60 mb-2"></i>
                <p class="text-sm font-semibold text-emerald-950/70">Cámara inactiva</p>
            </div>
            <!-- Overlay Mask to help align the Dominican ID Card -->
            <div id="overlay" class="absolute inset-0 border-4 border-amber-500/50 rounded-xl m-8 pointer-events-none hidden flex items-center justify-center">
                <span class="text-[10px] bg-amber-500 text-neutral-900 px-2 py-0.5 rounded font-bold uppercase tracking-wider absolute top-0 transform -translate-y-1/2">
                    Encuadre la cédula aquí
                </span>
            </div>
        </div>

        <!-- NOTIFICATION / STATUS BANNER -->
        <div id="statusBanner" class="w-full bg-[#085454]/90 backdrop-blur-sm border border-emerald-700 py-3 px-4 rounded-xl text-center shadow-md hidden transition-all duration-300">
            <p id="statusText" class="text-sm font-medium tracking-wide flex items-center justify-center gap-2">
                <!-- Status text changes dynamically via app.js -->
            </p>
        </div>

        <!-- USER ACTION INTERFACE BUTTONS -->
        <div class="w-full flex flex-col gap-4 mt-2">
            <!-- Action / Camera Button (Styled precisely to match the design) -->
            <button id="actionBtn" class="w-full bg-[#035151] hover:bg-[#023e3e] active:scale-[0.98] text-white font-bold text-xl py-4 px-6 rounded-2xl shadow-lg border-b-4 border-[#013535] flex items-center justify-center gap-3 transition-all duration-150">
                <i class="fa-solid fa-camera text-2xl"></i>
                <span id="btnText">Foto de cédula</span>
            </button>

            <!-- Success Entry Confirmation Button -->
            <button id="confirmBtn" class="w-full bg-[#d67b00] hover:bg-[#b86900] active:scale-[0.98] text-white font-bold text-2xl py-4 px-6 rounded-2xl shadow-lg border-b-4 border-[#945500] text-center hidden transition-all duration-150">
                Entrar
            </button>
        </div>
    </div>

    <!-- FOOTER COPYRIGHT STAMP -->
    <div class="z-10 text-xs font-semibold text-emerald-950/60 tracking-wider pb-4">
        &copy; 2026 Finquita Gloria • Control de Acceso
    </div>

    <!-- Application Script File Link -->
    <script src="app.js"></script>
</body>
</html>

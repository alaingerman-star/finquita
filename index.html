<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finquita Gloria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f7e6cc;
      font-family: system-ui, sans-serif;
    }

    .welcome {
      position: relative;
      width: min(100vw, 70.37vh);
      width: min(100vw, 70.37dvh);
      aspect-ratio: 1052 / 1495;
    }

    .welcome img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .welcome button {
      position: absolute;
      left: 6.84%;
      width: 86.31%;
      padding: 0;
      border: 0;
      border-radius: 4rem;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .welcome button:active {
      background: rgb(0 0 0 / 12%);
    }

    .welcome button:focus-visible {
      outline: 4px solid white;
      outline-offset: -8px;
    }

    #actionBtn {
      top: 44.88%;
      height: 12.84%;
    }

    #confirmBtn {
      top: 60.87%;
      height: 12.31%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }



    .camera-preview {
      position: relative;
      width: min(100%, 108dvh);
      aspect-ratio: 16 / 10;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 1rem;
      background: black;
    }

    #webcam {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      aspect-ratio: 1.59;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: end center;
      padding: 0.5rem;
      border: 3px dashed #ffc247;
      border-radius: 0.75rem;
      pointer-events: none;
    }

    #overlay span {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      background: #005a5b;
      text-align: center;
    }


    .camera-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: auto;
    }

    .camera-controls button {
      min-height: 48px;
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 0.65rem;
      font: inherit;
      cursor: pointer;
    }

    #captureBtn {
      background: #ffc247;
      color: #171717;
      font-weight: 700;
    }
    dialog { width: min(92vw, 34rem); max-height: 92dvh; border: 0; border-radius: 1rem; padding: 1.25rem; background: #fffaf1; color: #123b3b; }
    dialog::backdrop { background: #000b; }
    dialog h2 { margin-top: 0; }
    dialog label { display: grid; gap: .35rem; margin: .75rem 0; }
    dialog input, dialog select { width: 100%; padding: .7rem; font: inherit; }
    #cameraDialog {
      box-sizing: border-box;
      width: min(98vw, 64rem);
      max-width: 98vw;
      padding: clamp(.5rem, 2vw, 1rem);
    }
    @media (orientation: portrait) {
      .camera-preview { aspect-ratio: 4 / 5; width: min(100%, 48dvh); }
      #overlay { width: 90%; }
    }

    #overlay[data-vertical] {
      width: auto;
      height: 90%;
      aspect-ratio: 1 / 1.59;
    }

    dialog .camera-controls { margin: 1rem 0 0; }
    dialog button:disabled { opacity: .55; }
    #welcomeStatus { position: fixed; bottom: 1rem; margin: 0; padding: .65rem 1rem; background: #005a5b; color: white; border-radius: .6rem; }
    #welcomeStatus:empty { display: none; }
  </style>

  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="./app.js"></script>
</head>

<body>
  <main class="welcome" aria-label="Finquita Gloria">
    <img src="./finquita-gloria.webp" alt="" width="1052" height="1495">

    <button id="actionBtn" type="button">
      <span id="btnText" class="sr-only">Foto de cédula</span>
    </button>

    <button id="confirmBtn" type="button">
      <span class="sr-only">Entrar</span>
    </button>
  </main>

  <p id="welcomeStatus" role="status"></p>
  <dialog id="cameraDialog" aria-labelledby="cameraTitle">
    <h2 id="cameraTitle">Foto de cédula</h2>
    <p>Coloque el frente de la cédula dentro del marco.</p>
    <div class="camera-preview">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="overlay" aria-hidden="true"></div>
    </div>
    <p id="cameraStatus" role="status"></p>
    <div class="camera-controls">
      <button id="captureBtn" type="button" disabled>Tomar foto</button>
      <button id="rotateGuideBtn" type="button" aria-pressed="false">Marco vertical</button>
      <button id="manualBtn" type="button">Ingresar manualmente</button>
      <button id="cancelCameraBtn" type="button">Cancelar</button>
    </div>
  </dialog>
  <dialog id="reviewDialog" aria-labelledby="reviewTitle">
    <form id="reviewForm" autocomplete="off">
      <h2 id="reviewTitle">Registrar entrada</h2>
      <p id="reviewHint"></p>
      <label>Número de cédula
        <input id="cedula" inputmode="numeric" placeholder="000-0000000-0" maxlength="20" required>
      </label>
      <label>Nombre completo
        <input id="guestName" maxlength="120" required>
      </label>
      <fieldset>
        <legend>Guardia de seguridad</legend>
        <label>Nombre del guardia
          <input id="guardName" maxlength="120" required>
        </label>
        <label>Número del guardia
          <select id="guardNumber" required>
            <option value="">Seleccione un número</option>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </label>
      </fieldset>
      <p id="reviewStatus" role="status"></p>
      <div class="camera-controls">
        <button id="saveBtn" type="submit">Guardar entrada</button>
        <button id="cancelReviewBtn" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
